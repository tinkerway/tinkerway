[tools]
hk = "2.2.0"
betterleaks = "1.8.1"

[tasks.pre-commit]
description = "Run hk pre-commit (betterleaks on staged files)"
run = "hk run pre-commit"

[tasks.secrets-scan]
description = "Scan git history and working tree for secrets (local only; no --validation)"
run = [
  "betterleaks git --redact --verbose --no-banner",
  "betterleaks dir --redact --verbose --no-banner .",
]
