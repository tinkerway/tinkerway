[tools]
hk = "2.2.0"
gitleaks = "8.30.1"

[tasks.pre-commit]
description = "Run hk pre-commit (gitleaks on staged files)"
run = "hk run pre-commit"

[tasks.secrets-scan]
description = "Scan git history and working tree for secrets"
run = [
  "gitleaks git --redact --verbose --no-banner",
  "gitleaks dir --redact --verbose --no-banner .",
]
