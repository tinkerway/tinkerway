[package]
name = "tinkerway"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-OSaasy"
description = "tinkerway desktop app — capture a line as a note, list it, click to read"
publish = false

[lib]
name = "tinkerway"
path = "src/lib.rs"

[[bin]]
name = "tinkerway"
path = "src/main.rs"

[dependencies]
# Zed GPUI (Apache-2.0). Official gpui_platform is not on crates.io yet for 0.2.x;
# Application::new() embeds platform backends. Default features include wayland/x11
# so `cargo check` works on Linux VMs; Mac uses Metal via the same crate.
gpui = { version = "=0.2.2", default-features = true }

[dev-dependencies]
# Enables TestAppContext / #[gpui::test]. Unions with the dependency above for tests;
# pulls leak-detection, rand, and related test-support transitive features.
gpui = { version = "=0.2.2", default-features = true, features = ["test-support"] }
