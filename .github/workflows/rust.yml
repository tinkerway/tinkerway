name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: cargo test / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3

      - name: Install GPUI Linux link deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            cmake \
            clang \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-randr0-dev \
            libegl1-mesa-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            libsecret-1-dev

      - name: cargo test
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          cargo test -p tinkerway-vault -p tinkerway

      - name: cargo check
        run: |
          export LIBRARY_PATH="$(dirname "$(g++ -print-file-name=libstdc++.so)"):${LIBRARY_PATH:-}"
          cargo check -p tinkerway-vault -p tinkerway
