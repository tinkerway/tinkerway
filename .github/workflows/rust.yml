name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cargo test / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3

      # Same boring Cargo cache jdx/mise uses on GitHub-hosted runners.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install vault + Tauri Linux link deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libsecret-1-dev

      - name: cargo test (vault)
        run: cargo test -p tinkerway-vault

      # MBX_DISABLE: Tauri ACL permission files can vanish under mbx cache restore.
      - name: cargo check (Tauri Demo v1)
        run: MBX_DISABLE=1 cargo check -p tinkerway-tauri
