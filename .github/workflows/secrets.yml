name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org repos need GITLEAKS_LICENSE; personal/public repos do not.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
