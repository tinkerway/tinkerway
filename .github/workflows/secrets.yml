name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:
  # Official gitleaks-action example: catch history/config drift even without new pushes.
  schedule:
    - cron: "0 4 * * *"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org repos need a free license from gitleaks.io as repo/org secret GITLEAKS_LICENSE.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Match mise.toml so local hooks and CI use the same scanner.
          GITLEAKS_VERSION: "8.30.1"
          # CLI auto-loads .gitleaks.toml; set explicitly for the action.
          GITLEAKS_CONFIG: .gitleaks.toml
