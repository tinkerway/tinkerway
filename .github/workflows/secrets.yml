name: secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Catch history/config drift even without new pushes.
  schedule:
    - cron: "0 4 * * *"

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      # Local git history scan only — no --validation, no github/gitlab/s3.
      - run: betterleaks git --redact --verbose --no-banner
