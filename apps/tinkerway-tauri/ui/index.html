<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tinkerway</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="chrome">
        <button type="button" class="brand" id="btn-home" aria-label="Tinkerway home">
          <img src="tinkerway-icon.png" width="32" height="32" alt="" />
          <span class="brand-name">Tinkerway</span>
        </button>
        <div id="breadcrumb" class="breadcrumb hidden" aria-hidden="true">
          <span class="crumb-sep">></span>
          <span class="crumb-label">Shortcuts</span>
        </div>
        <button
          type="button"
          class="chrome-close hidden"
          id="btn-close-shortcuts"
          aria-label="Close shortcuts"
        >
          ×
        </button>
      </header>

      <main id="home" class="home">
        <section class="compose-pane" aria-label="Write">
          <div id="write-card" class="mist-card write-card">
            <textarea
              id="compose"
              class="compose"
              placeholder="What's new?"
              spellcheck="true"
              autofocus
            ></textarea>
            <button type="button" class="pill send" id="btn-send" disabled>
              <span class="pill-label">Send</span>
              <span class="pill-chord hidden" id="send-chord" data-chord="mod-enter"></span>
            </button>
          </div>
          <div id="read-card" class="mist-card read-card hidden" aria-live="polite">
            <div class="view-label">View</div>
            <div id="read-body" class="read-body"></div>
          </div>
        </section>

        <aside class="library" aria-label="Library">
          <div class="library-toolbar">
            <button type="button" class="pill new" id="btn-new">
              <span class="pill-label">New</span>
              <span class="pill-chord hidden" id="new-chord" data-chord="mod-n"></span>
            </button>
          </div>
          <ul id="note-list" class="note-list"></ul>
        </aside>
      </main>

      <section id="shortcuts" class="shortcuts-page hidden" aria-label="Shortcuts">
        <p class="shortcuts-intro">
          Hold <kbd class="keycap" data-mod-name>Cmd</kbd> to see the shortcut keys anywhere in the
          app.
        </p>
        <ul class="shortcut-rows">
          <li class="shortcut-row">
            <div class="shortcut-keys"><kbd class="keycap">?</kbd></div>
            <span class="shortcut-label">Shortcuts</span>
          </li>
          <li class="shortcut-row">
            <div class="shortcut-keys">
              <kbd class="keycap" data-mod-name>Cmd</kbd>
              <span class="plus">+</span>
              <kbd class="keycap">Enter</kbd>
            </div>
            <span class="shortcut-label">Send</span>
          </li>
          <li class="shortcut-row">
            <div class="shortcut-keys">
              <kbd class="keycap" data-mod-name>Cmd</kbd>
              <span class="plus">+</span>
              <kbd class="keycap">N</kbd>
            </div>
            <span class="shortcut-label">New</span>
          </li>
          <li class="shortcut-row">
            <div class="shortcut-keys"><kbd class="keycap">esc</kbd></div>
            <span class="shortcut-label">Leave</span>
          </li>
        </ul>
      </section>

      <footer class="shortcuts-hint">
        <button type="button" class="hint-btn" id="btn-shortcuts">
          <span>Shortcuts</span>
          <kbd class="keycap">?</kbd>
        </button>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
