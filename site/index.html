<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tinkerway</title>
  <meta name="description" content="build something. anything. whatever you want.">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      box-sizing: border-box;
    }
    main { width: min(28rem, 100%); }
    h1 {
      font-weight: 500;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
      margin: 0 0 1.75rem;
    }
    .line {
      font-size: 1.75rem;
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin: 0 0 1.5rem;
    }
    p { font-size: 1rem; line-height: 1.5; margin: 0 0 2rem; color: #c8c8c8; }
    a { color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>tinkerway</h1>
    <p class="line">build something. anything. whatever you want.</p>
    <p>A workshop for a maker, or a small team. You type whatever is in your head. The app keeps the context and hands the next piece to a tool you already use.</p>
    <a href="https://github.com/tinkerway/tinkerway">Source</a>
  </main>
</body>
</html>
